<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDD Artifact Preview</title>
  <link rel="stylesheet" href="/console.css">
</head>
<body class="preview-body">
  <header class="preview-topbar">
    <div>
      <div id="preview-eyebrow" class="eyebrow">Artifact Preview</div>
      <h1 id="preview-title">Loading</h1>
      <p id="preview-path"></p>
    </div>
    <button id="edit-artifact" class="primary-action" type="button">Edit</button>
  </header>

  <main class="preview-shell">
    <pre id="preview-content" class="preview-content">Loading...</pre>
  </main>

  <script src="/preview.js"></script>
</body>
</html>
